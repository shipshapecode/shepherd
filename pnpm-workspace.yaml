packages:
  - shepherd.js
  - landing
  - packages/*
  - docs-src

allowBuilds:
  cypress: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@astrojs/starlight@0.42.0'

# 0.1.3 omits the runtime it loads; 0.1.4 declares it.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3

onlyBuiltDependencies:
  - cypress
  - esbuild
  - sharp

overrides:
  '@tootallnate/once@<2.0.1': '>=2.0.1'
  diff@>=6.0.0 <8.0.3: '>=8.0.3'
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  fast-uri@>=3.1.3 <3.1.6: '^3.1.6'
  minimatch@<3.1.4: '>=3.1.4'
  path-to-regexp@>=4.0.0 <6.3.0: '^6.3.0'
  postcss-selector-parser@<6.1.5: '^6.1.5'
  sharp@<0.35.0: '>=0.35.0'
  sigstore@<=4.1.0: '>=4.1.1'
  svelte@<5.55.7: '>=5.55.7'
  tar@<7.5.21: '>=7.5.21'

patchedDependencies:
  cypress-plugin-tab@2.0.0: patches/cypress-plugin-tab@2.0.0.patch
